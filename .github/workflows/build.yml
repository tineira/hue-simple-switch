name: build

# Compile check for pull requests. Build only: no upload, no release, no secrets.
# The release is firmware.yml, on push to main.
on:
  pull_request:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      # A core or library bump must update THIRD_PARTY.json in the same PR (release credits).
      - name: Credits match sketch.yaml
        run: python3 scripts/check-credits.py

      # Plain C++ on the runner (g++, no board), with AddressSanitizer and UBSan: the JSON
      # helpers and the config-poll parsers. Inside this job so the required check stays `compile`.
      - name: Host tests
        run: SANITIZE=1 test/host/run.sh

      - uses: arduino/setup-arduino-cli@v2

      - name: Product config.h
        run: cp config.product.h config.h

      # Same size limit as the release: the min_spiffs app partition.
      - name: Compile
        run: arduino-cli compile --profile xiao-c6 --build-property upload.maximum_size=1966080 .
