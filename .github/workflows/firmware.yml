name: USB installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  usb-installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Product config.h
        run: cp config.product.h config.h

      - name: Compile
        run: arduino-cli compile --profile xiao-c6 --export-binaries --build-property upload.maximum_size=1966080 .

      - name: Stage dist/installer
        run: |
          set -euo pipefail
          VERSION=$(sed -n 's/.*#define FIRMWARE_VERSION "\([^"]*\)".*/\1/p' console.h | tr -d '\r' | head -n1)
          if [ -z "$VERSION" ]; then
            echo "FIRMWARE_VERSION not found" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist/installer
          EXP=build/esp32.esp32.XIAO_ESP32C6
          cp "$EXP/hue-simple-switch.ino.bootloader.bin" dist/installer/bootloader.bin
          cp "$EXP/hue-simple-switch.ino.partitions.bin" dist/installer/partitions.bin
          cp "$EXP/boot_app0.bin" dist/installer/boot_app0.bin
          cp "$EXP/hue-simple-switch.ino.bin" dist/installer/firmware.bin
          ls -l dist/installer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usb-installer-simple
          path: |
            dist/installer/bootloader.bin
            dist/installer/partitions.bin
            dist/installer/boot_app0.bin
            dist/installer/firmware.bin
          if-no-files-found: error

      - name: Upload to console
        env:
          FIRMWARE_UPLOAD_TOKEN: ${{ secrets.FIRMWARE_UPLOAD_TOKEN }}
        run: |
          # errexit off so every failure below reaches its ::error:: line.
          set +e -uo pipefail
          if [ -z "${FIRMWARE_UPLOAD_TOKEN}" ]; then
            echo "::error::FIRMWARE_UPLOAD_TOKEN secret missing; cannot upload the release to the console."
            exit 1
          fi
          if [ ! -f CHANGELOG.md ]; then
            echo "::error::CHANGELOG.md missing; a release must have notes."
            exit 1
          fi
          # Notes: the CHANGELOG.md section whose heading starts with this version,
          # up to the next ### or ## heading, HTML comments removed, blank edges trimmed.
          awk -v v="$VERSION" '
            /^##+ / && f { exit }
            /^### / { h = substr($0, 5); if (h == v || index(h, v " ") == 1) { f = 1; next } }
            f
          ' CHANGELOG.md \
            | perl -0pe 's/<!--.*?-->\n?//gs' \
            | sed -e '/[^[:space:]]/,$!d' \
            | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}' > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md entry for ${VERSION}; add a '### ${VERSION} — YYYY-MM-DD' section."
            exit 1
          fi
          echo "Notes for ${VERSION}:"
          cat notes.md
          # Credits: THIRD_PARTY.json must be valid and list every platform and
          # library pinned in sketch.yaml at the same version.
          python3 - <<'PY'
          import json, re, sys
          def fail(msg):
              print(f"::error::{msg}")
              sys.exit(1)
          try:
              with open("THIRD_PARTY.json", encoding="utf-8") as f:
                  credits = json.load(f)
          except FileNotFoundError:
              fail("THIRD_PARTY.json missing; a release must list its third-party components.")
          except ValueError as e:
              fail(f"THIRD_PARTY.json is not valid JSON: {e}")
          if not isinstance(credits, list) or not credits:
              fail("THIRD_PARTY.json must be a non-empty JSON array.")
          for i, c in enumerate(credits):
              if not isinstance(c, dict) or not all(
                  isinstance(c.get(k), str) and c[k].strip() for k in ("name", "version", "license", "url")
              ):
                  fail(f"THIRD_PARTY.json entry {i} needs non-empty name, version, license and url strings.")
          have = {c["name"]: c["version"] for c in credits}
          # sketch.yaml platform IDs map to the names used in THIRD_PARTY.json.
          platform_names = {"esp32:esp32": "Arduino-ESP32 core"}
          pinned = []
          section = None
          with open("sketch.yaml", encoding="utf-8") as f:
              for line in f:
                  line = line.split("#", 1)[0].rstrip()
                  if not line.strip():
                      continue
                  key = re.match(r"^\s*([A-Za-z_]+):\s*$", line)
                  if key:
                      section = key.group(1)
                      continue
                  plat = re.match(r"^\s*-\s*platform:\s*(\S+)\s*\(([^)]+)\)\s*$", line)
                  if plat:
                      pid, ver = plat.groups()
                      if pid not in platform_names:
                          fail(f"sketch.yaml platform {pid} ({ver}) has no THIRD_PARTY.json name mapping in firmware.yml.")
                      pinned.append((f"platform {pid}", platform_names[pid], ver))
                      continue
                  lib = re.match(r"^\s*-\s*(.+?)\s*\(([^)]+)\)\s*$", line)
                  if lib and section == "libraries":
                      pinned.append((f"library {lib.group(1)}", lib.group(1), lib.group(2)))
          if not pinned:
              fail("No platform found in sketch.yaml; cannot check THIRD_PARTY.json.")
          for what, name, ver in pinned:
              if name not in have:
                  fail(f"sketch.yaml {what} ({ver}) is not listed in THIRD_PARTY.json as \"{name}\".")
              if have[name] != ver:
                  fail(f"sketch.yaml {what} is {ver} but THIRD_PARTY.json \"{name}\" says {have[name]}.")
              print(f"Credits OK: {name} {ver}")
          PY
          if [ $? -ne 0 ]; then
            exit 1
          fi
          D=dist/installer
          rm -f resp.json
          CODE=$(curl -sS -o resp.json -w '%{http_code}' -X POST "https://hue.tineira.com/api/firmware/simple" \
            -H "Authorization: Bearer ${FIRMWARE_UPLOAD_TOKEN}" \
            -F "version=${VERSION}" \
            -F "commit=${GITHUB_SHA}" \
            -F "notes=<notes.md" \
            -F "credits=<THIRD_PARTY.json" \
            -F "bootloader.bin=@${D}/bootloader.bin" \
            -F "partitions.bin=@${D}/partitions.bin" \
            -F "boot_app0.bin=@${D}/boot_app0.bin" \
            -F "firmware.bin=@${D}/firmware.bin")
          RC=$?
          BODY=$(cat resp.json 2>/dev/null)
          echo "HTTP ${CODE}"
          echo "${BODY}"
          if [ "$RC" -ne 0 ]; then
            echo "::error::Console upload failed: curl exit ${RC} (transport error). ${BODY}"
            exit 1
          fi
          case "$CODE" in
            200|201)
              echo "Uploaded ${VERSION} to the console."
              exit 0 ;;
            409)
              echo "::warning::version_exists: ${VERSION} bins are already released (notes were updated). Bump FIRMWARE_VERSION to ship new bins."
              exit 0 ;;
            *)
              echo "::error::Console upload failed (HTTP ${CODE}): ${BODY}"
              exit 1 ;;
          esac

      - name: Rolling GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=usb-installer
          TITLE="USB installer ${VERSION}"
          NOTES="Product USB installer (no USB logs). Firmware ${VERSION}, XIAO ESP32-C6."
          FILES=(
            dist/installer/bootloader.bin
            dist/installer/partitions.bin
            dist/installer/boot_app0.bin
            dist/installer/firmware.bin
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "${FILES[@]}" --title "$TITLE" --notes "$NOTES"
          fi
