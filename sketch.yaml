profiles:
  xiao-c6:
    fqbn: esp32:esp32:XIAO_ESP32C6
    # App partition via sketch partitions.csv (min_spiffs: ~1.9MB APP, OTA kept).
    # Product installer: copy config.product.h config.h
    #   arduino-cli compile --profile xiao-c6 --export-binaries --build-property upload.maximum_size=1966080 .
    # Offsets: docs/firmware-artifacts.md
    platforms:
      # The official Arduino index does not list esp32; without this URL the profile cannot resolve 3.3.12.
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
default_profile: xiao-c6
